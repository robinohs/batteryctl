version: 2.1

executors:
  rust-executor:
    docker:
      - image: cimg/rust:1.92

jobs:
  check:
    executor: rust-executor
    steps:
      - checkout
      - run:
          name: Install Clippy
          command: rustup component add clippy
      - run:
          name: Run Clippy
          command: cargo clippy --all-targets --all-features -- -D warnings
      - run:
          name: Run Format
          command: cargo fmt -- --check
  build:
    executor: rust-executor
    steps:
      - checkout
      - run:
          name: Build (debug)
          command: cargo build
      - persist_to_workspace:
          root: target
          paths:
            - debug
  test:
    executor: rust-executor
    steps:
      - checkout
      - attach_workspace:
          at: target
      - run:
          name: Run Tests
          command: cargo test --all-features

workflows:
  production:
    jobs:
      - check
      - build:
          requires:
            - check
      - test:
          requires:
            - build
