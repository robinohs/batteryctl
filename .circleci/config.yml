version: 2.1

jobs:
  check:
    docker:
      - image: cimg/rust:1.92
    steps:
      - checkout
      - run:
          name: Install Clippy
          command: rustup component add clippy
      - run:
          name: Run Clippy
          command: cargo clippy --all-targets --all-features -- -D warnings
      - run:
          name: Run Format
          command: cargo fmt -- --check
  test:
    docker:
      - image: cimg/rust:1.92
    steps:
      - checkout
      - run:
          name: Run Tests
          command: cargo test --all-features
  build:
    docker:
      - image: cimg/rust:1.92
    steps:
      - checkout
      - run:
          name: Build Project
          command: cargo build --release

workflows:
  production:
    jobs:
      - check
      - test
      - build
